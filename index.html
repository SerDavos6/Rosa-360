/* ===== Squadra · nuova interfaccia =====
   Struttura: intestazione fissa in alto, contenuto che scorre al centro, barra di navigazione fissa in basso.
   Barre piene (niente trasparenze né elementi fluttuanti): il contenuto scorre sempre e solo nella zona centrale. */
:root{--ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--num:Oswald,"Arial Narrow",sans-serif;--navh:60px;--r:16px;
 --bg:#f4f6fa;--sf:#ffffff;--tx:#0f172a;--mu:#55637a;--bd:#e5e9f0;--ac:#0b7a43;--acf:#0b7a43;--ac2:#e8f3ec;--on:#ffffff;--dg:#c62828;color-scheme:light}
:root:root:root{--bg:#0b0f17;--sf:#121826;--tx:#f1f5f9;--mu:#94a3b8;--bd:#222c3c;--ac:#f5c518;--acf:#f5c518;--ac2:#2a2615;--on:#111111;--dg:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{font:15px/1.45 var(--ui);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;max-width:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:761px){#app{border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pg{max-width:760px;margin:0 auto;padding:14px 14px 32px}
.view.plain .pg{padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}

/* --- intestazione fissa --- */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--sf);border-bottom:1px solid var(--bd)}
.bar .crest{width:38px;height:38px;border-radius:11px;padding:3px}
.bar .tn{flex:1;min-width:0;font:800 17px/1.15 var(--ui);letter-spacing:-.02em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.ib .ic{width:22px;height:22px}.tool .seg .ic{width:20px;height:20px}
.ib{flex:0 0 auto;width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid var(--bd);font-size:20px}
.ssn{flex:0 0 auto;width:auto;min-height:40px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg)}
.mbar{flex-direction:column;align-items:stretch;gap:0;padding-bottom:0}
.mtop{display:flex;align-items:center;gap:6px;margin:0 -6px}
.mmeta{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:600;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mscore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:2px 0 12px}
.mscore .tm{min-width:0;text-align:center;font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:5px}
.mscore .tm .crest{width:40px;height:40px;border-radius:12px}
.mscore .sc2{font:700 44px/1 var(--num);letter-spacing:.02em;color:var(--ac);white-space:nowrap}
.mtabs{display:flex;margin:0 -14px;border-top:1px solid var(--bd)}
.mtabs button{flex:1;min-height:46px;border:0;border-radius:0;background:transparent;color:var(--mu);font-size:14px;font-weight:700;padding:8px 4px;white-space:nowrap}
.mtabs .on{color:var(--ac);box-shadow:inset 0 -3px 0 var(--acf)}

/* --- navigazione fissa in basso --- */
.bn{flex:none;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bn button{flex:1;position:relative;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;border:0;border-radius:0;background:transparent;color:var(--mu);font-size:12px;font-weight:700}
.bn button span{display:block;font-size:24px;line-height:1}
.bn .on{color:var(--ac)}
.bn .on::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--acf)}
.dot{position:absolute;top:8px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--dg);border:2px solid var(--sf)}
@media (pointer:coarse){.kb .bn{display:none}}
.sbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--ac2);border-top:1px solid var(--bd);font-weight:700}
.sbar[hidden]{display:none}.sbar button{min-height:44px;padding:8px 26px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;z-index:60;background:var(--tx);color:var(--bg);border-left:6px solid var(--dg);border-radius:12px;padding:13px 16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tin .22s ease-out}.toast.ok{border-left-color:var(--acf)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- testo, schede, campi, pulsanti --- */
h1{font:800 28px/1.1 var(--ui);letter-spacing:-.02em;margin:6px 0 14px}
h2{font:700 13px/1.2 var(--num);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:22px 0 10px}
h3{font:700 16px/1.2 var(--ui);margin:0}
.hd{font-family:var(--ui);font-weight:800;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:13px}
.err{color:var(--dg);font-size:13px;margin-top:6px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:12px 0 5px;letter-spacing:.02em}
input,select,textarea{width:100%;font:16px var(--ui);color:var(--tx);min-height:46px;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
input[type=date]::-webkit-datetime-edit,input[type=time]::-webkit-datetime-edit{padding:0}
button,.chip,.mrow,.nxt,.hero2,.bn button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;padding:0;accent-color:var(--acf)}
input[type=file]{min-height:0;font-size:14px;padding:9px 12px}
input[type=color]{padding:3px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acf);outline-offset:1px;border-color:transparent}
button{font:700 15px var(--ui);color:var(--tx);min-height:44px;padding:10px 16px;border-radius:12px;background:var(--sf);border:1px solid var(--bd);cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}
button.p{background:var(--acf);color:var(--on);border-color:transparent}
button.d{color:var(--dg)}
button.s{min-height:40px;padding:7px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px;min-width:0}.row>button{flex:0 0 auto}
.match-detail-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start;width:100%;min-width:0}.match-detail-row>div{min-width:0;width:100%;max-width:100%}
input[type=date],input[type=time],input[type=datetime-local],.match-detail-row input[type=time],.match-detail-row input[type=date]{display:block!important;-webkit-appearance:none!important;appearance:none!important;box-sizing:border-box!important;width:100%!important;min-width:0!important;max-width:100%!important;height:46px!important;min-height:46px!important;margin:0!important;padding:0 14px!important;line-height:46px!important;text-align:left!important;overflow:hidden;border-radius:12px;background:var(--bg)}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left!important;height:46px;line-height:46px;margin:0;padding:0;min-height:0}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700}
.gold{color:var(--ac);font-weight:700;font-size:14px}
.ic{width:1em;height:1em;vertical-align:-.14em;flex:0 0 auto}.ic.y{color:#f5c518}.ic.r{color:#ff5a5a}
.crest{width:56px;height:56px;border-radius:14px;object-fit:contain;background:#ffffffee;border:1px solid rgba(15,23,42,.08);padding:4px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;color:#334155}
.crest.sm{width:40px;height:40px;border-radius:11px;font-size:19px}
.crest.xl{width:96px;height:96px;border-radius:50%;font-size:44px;margin:0 auto 10px}
.crest .ic{width:56%;height:56%;vertical-align:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:430px}td,th{padding:4px;text-align:center;border-bottom:1px solid var(--bd);font-size:13px}td:first-child,th:first-child{text-align:left}td input{width:52px;min-height:0;padding:5px;text-align:center;font-size:14px}

/* --- selettori: segmentato, pillole --- */
.seg{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px;padding:4px;background:var(--bd);background:color-mix(in srgb,var(--tx) 9%,var(--bg));border-radius:14px;margin:6px 0}
.seg button{flex:1 0 auto;min-height:42px;padding:6px 8px;border:0;background:transparent;border-radius:10px;font-size:14px;color:var(--tx);white-space:nowrap}
.seg .on{background:var(--acf);color:var(--on)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:10px 14px;border-radius:999px;font-weight:700;min-height:44px;background:var(--sf);border:1px solid var(--bd)}
.chip i{font-style:normal;opacity:.6;margin-left:5px;font-weight:600}.chip.on i{opacity:.8}.chips .chip i{margin:0 6px 0 0;opacity:.75}
.chip.on{background:var(--acf);color:var(--on);border-color:transparent}
.rfl,.mfl,.csl{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:2px 14px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rfl::-webkit-scrollbar,.mfl::-webkit-scrollbar,.csl::-webkit-scrollbar{display:none}
.rfl .chip,.mfl .chip,.csl .chip{white-space:nowrap;flex:0 0 auto;padding:8px 14px;min-height:40px}
.plus{display:inline-flex;align-items:center;gap:6px}
.tool{display:flex;align-items:center;gap:10px;margin:0 0 8px}.tool h2{margin:0;flex:1}
.tool .seg{margin:0;flex:0 0 auto}.tool .seg button{flex:0 0 auto;min-width:46px}

/* --- partite --- */
.nxt{cursor:pointer;border:0;color:var(--on);background:var(--acf);background:linear-gradient(135deg,var(--acf),color-mix(in srgb,var(--acf) 62%,#000));position:relative;overflow:hidden}
.nxt::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.13)}
.nxt>*{position:relative;z-index:1}.nxt .hd{font-size:26px;margin:6px 0 4px;color:inherit}.nxt .mu{color:inherit;opacity:.85;font-size:13px}
.eb{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}.nxt .eb{color:inherit;opacity:.85}
.hero2{position:relative;overflow:hidden;cursor:pointer;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero2 .wm{position:absolute;right:-12px;bottom:-12px;width:130px;height:130px;object-fit:contain;opacity:.08}
.hero2>*{position:relative}.hero2 .wm{position:absolute}
.big{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 12px}
.big .t{font-size:15px;font-weight:800;line-height:1.2;overflow-wrap:break-word;min-width:0}.big .t:last-child{text-align:right}
.big b{font:700 52px/1 var(--num);color:var(--ac);letter-spacing:.02em}
.scl{list-style:none;margin:0 0 12px;padding:0}.scl li{padding:2px 0;font-weight:600}.scl li .ic{margin-right:6px;color:var(--ac)}
.mvp{display:inline-block;background:var(--ac2);color:var(--ac);font-weight:800;border-radius:999px;padding:7px 14px;font-size:14px}
.mrow{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 14px 12px 12px;border-left:5px solid var(--bd)}
.mrow.w{border-left-color:#34d399}.mrow.l{border-left-color:#f87171}.mrow.d{border-left-color:#fbbf24}.mrow.u{border-left-color:var(--acf)}
.mrow{content-visibility:auto;contain-intrinsic-size:auto 76px}.mrow:active{transform:scale(.99)}.mrow .mid{flex:1;min-width:0}.mrow .hd{font-size:16px;line-height:1.2}
.mrow .mid .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db{flex:0 0 auto;width:50px;text-align:center;background:var(--ac2);color:var(--ac);border-radius:12px;padding:6px 0;font-size:11px;font-weight:800;letter-spacing:.05em}
.db b{display:block;font:700 24px/1 var(--num);color:var(--ac);letter-spacing:0}
.rs{text-align:right;flex:0 0 auto}.rs .hd{display:block;font:700 24px/1 var(--num)}
.rb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-weight:800;font-size:12px;color:#0b1220;margin-top:5px}
.rb.v{background:#34d399}.rb.n{background:#fbbf24}.rb.p{background:#f87171}
.fm{display:inline-block;width:24px;height:24px;border-radius:8px;margin-right:6px}.fm.v{background:#34d399}.fm.n{background:#fbbf24}.fm.p{background:#f87171}
.mp{animation:fadein .16s ease-out}@keyframes fadein{from{opacity:.4}to{opacity:1}}
.pcg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;width:100%;min-width:0}
.pcg label{display:flex;align-items:center;gap:10px;min-width:0;width:100%;margin:0;padding:10px 12px;min-height:46px;border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:15px;font-weight:600;letter-spacing:0;background:var(--bg);overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
.pcg label:has(input:checked){border-color:var(--acf);background:var(--ac2)}
.pcg input{flex:0 0 20px;width:20px;height:20px;margin:0}
.pcg label{line-height:1.25}
.pcg label span{min-width:0;flex:1;overflow-wrap:anywhere;word-break:break-word}
 .pc-section{margin-top:14px}.pc-section:first-child{margin-top:10px}.pc-title{display:flex;align-items:center;gap:7px;margin:0 2px 7px;color:var(--tx);font-size:14px;font-weight:800;letter-spacing:.2px}.pc-title span{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ac2);color:var(--acf);font-size:12px}
@media (max-width:380px){.pcg{gap:6px}.pcg label{gap:8px;padding:9px 10px;font-size:14px}.pcg input{flex-basis:19px;width:19px;height:19px}}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 0;color:var(--tx);font-size:15px;letter-spacing:0}.chk input{width:22px;height:22px}
.formation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.formation-grid label{font-size:11px;text-transform:uppercase;margin-bottom:3px}.formation-grid select{margin:0}.formation-grid>div:first-child{grid-column:1/-1}
.sp{padding:12px 14px}.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.stp .mu{display:block;font-size:12px;margin-bottom:3px}
.stp>div{display:flex;align-items:center;gap:4px}.stp button{flex:0 0 38px;width:38px;min-height:44px;padding:0;font-size:20px;line-height:1}.stp input{flex:1;min-width:0;width:100%;text-align:center;padding:10px 0;min-height:44px}
.lvh{display:flex;justify-content:space-between;align-items:center}.lvs{font:700 52px/1 var(--num);color:var(--ac);display:inline-block}
.lvs.pop{animation:lvpop .5s ease-out}@keyframes lvpop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.lvbar{margin-top:12px;padding:12px;border-radius:14px;background:var(--ac2)}.lvbar>b{display:block;margin-bottom:8px}
.live button{min-height:44px}.lvlog{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--bd)}.lvlog li{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}

/* --- rosa, carte giocatore --- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fut{position:relative;overflow:hidden;color:var(--on);text-align:center;border:2px solid rgba(255,255,255,.42);border-radius:24px 24px 46px 46px;padding:12px 10px 14px;background:var(--acf);background:linear-gradient(165deg,color-mix(in srgb,var(--acf) 84%,#fff),var(--acf) 48%,color-mix(in srgb,var(--acf) 80%,#000));box-shadow:0 12px 24px -12px rgba(0,0,0,.5)}
.fut::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.26) 46%,transparent 60%)}
.fut .ov{position:absolute;left:12px;top:10px;font:700 36px/1 var(--num)}
.fut .ps{position:absolute;left:12px;top:46px;font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85}
.fut .cr{position:absolute;left:12px;top:66px;width:28px;height:28px;object-fit:contain}

.fut .st{display:grid;grid-template-columns:repeat(3,1fr);font-size:11px;margin-top:8px}.fut .st b{display:block;font:700 16px var(--num)}
.fut.ng{filter:grayscale(.35)}
.fut.t-b{border-color:#cd7f32}.fut.t-s{border-color:#e3e8ee}.fut.t-g{border-color:#ffd54a;box-shadow:0 3px 16px #ffd54a55,0 3px 10px #0004}.fut.t-x{border-color:#fff3a8;box-shadow:0 0 22px #ffe36e99,0 3px 10px #0004}
.mng{margin-top:6px;text-align:center}
.mng summary{display:inline-block;list-style:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--mu);padding:8px 16px;border-radius:999px;background:var(--sf);border:1px solid var(--bd)}
.mng summary::-webkit-details-marker{display:none}.mng[open] summary{color:var(--ac)}
.mng .row{justify-content:center;gap:6px;margin-top:8px}.mng button.s{min-height:38px;padding:6px 12px;font-size:12px;border-radius:999px}

.pl .o{font:700 24px var(--num);color:var(--ac);min-width:34px;text-align:right}
.add{padding:0}.add summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;display:flex;align-items:center;gap:8px}.add summary::-webkit-details-marker{display:none}.add[open] summary{border-bottom:1px solid var(--bd)}.add .in{padding:4px 14px 14px}

/* --- classifiche, tessere, podio --- */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.pgrid .tl{min-width:0}
.tl{background:var(--bg);border-radius:12px;padding:10px 2px;text-align:center;font-size:11.5px;font-weight:600;color:var(--mu)}
.tl b{display:block;font:700 22px/1.1 var(--num);color:var(--tx)}
.lr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.lr:last-child{border:0}.rk{width:22px;color:var(--mu);font-weight:800}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0 14px}.pod>div{flex:1;max-width:130px;text-align:center}
.pod .crest{margin:0 auto 6px;width:64px;height:64px;border-radius:50%;font-size:28px}.pod .p1 .crest{width:84px;height:84px;border:3px solid #ffd54a}

.pod .pl2{font:700 24px/1 var(--num)}.pod .pv{font:700 22px var(--num)}.pod .pn{font-weight:800;font-size:14px;overflow-wrap:anywhere}

/* --- profilo, accesso, home --- */
.pcard{text-align:center}.pcard .nm2{font:800 24px var(--ui);letter-spacing:-.02em;margin-top:6px}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.pbtns button{min-height:46px;padding:10px 8px;font-size:14px}
.pcard .out{display:block;width:100%;margin-top:14px;padding-top:14px;border:0;border-top:1px solid var(--bd);border-radius:0;background:none;color:var(--dg);min-height:48px}
.code{font-size:30px;font-weight:800;letter-spacing:4px;text-align:center;padding:12px;border:2px dashed var(--bd);border-radius:16px;margin:8px 0;cursor:pointer;background:var(--bg)}
.tcard{display:flex;align-items:center;gap:12px;cursor:pointer}.tcard:active{transform:scale(.99)}.tcard .mid{flex:1;min-width:0}
.logo0{text-align:center;padding:18px 0 8px}.logo0 img{width:96px;height:96px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.logo0 h1{margin:12px 0 4px;font-size:34px}

/* --- scheda giocatore: pannello dal basso --- */
.pmw{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(5,8,14,.66)}
.pm{width:100%;max-width:560px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--sf);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sheet .32s cubic-bezier(.2,.85,.25,1)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.pm h2:first-of-type{margin-top:0}

/* --- finestre di condivisione --- */
dialog{max-width:600px;width:calc(100% - 24px);max-height:90vh;max-height:90dvh;overflow-y:auto;border:0;border-radius:24px;background:var(--sf);color:var(--tx);padding:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,12,20,.72)}dialog img{width:100%;height:auto;border-radius:12px;margin:12px 0}dialog .row{position:sticky;bottom:0;background:var(--sf);padding:8px 0}

.report-full{display:flex;gap:8px;align-items:center;margin:14px 0}.report-full input{width:auto;flex:0 0 auto}#report-image[aria-busy="true"]{opacity:.55}

/* --- mobile/PWA robustness: niente overflow orizzontale nelle liste --- */
@media (max-width:760px){

}

}

  ${trendChart(l)}<h2>Per torneo</h2>${[...tors,...(tors.length>1?[["Totale",r]]:[])].map(([n,x])=>`<div class="card"><b class="hd">${esc(n)}</b><div class="pgrid">${tile(x.g,"GIOCATE")}${tile(x.v,"VITTORIE")}${tile(x.n,"PAREGGI")}${tile(x.p,"SCONFITTE")}${tile(x.gf,"GOL FATTI")}${tile(x.ga,"GOL SUBITI")}${tile((x.dr>0?"+":"")+x.dr,"DIFF. RETI")}${tile(x.pt,"PUNTI")}</div></div>`).join("")}`}
function stats(m){
  const t={p:0,g:0,a:0,og:0,y:0,r:0,gs:0,ps:0};
  S.matches.filter(x=>x.tid===m.tid&&x.played&&inSeason(x)&&(x.present||[]).includes(m.id)).forEach(x=>{
    const s=(x.stats||{})[m.id]||{};t.p++;for(const k of["g","a","og","y","r","gs","ps"])t[k]+=+s[k]||0});
  return t}
function ovr(m){
  const t=stats(m);const w=W[m.pos]||[0,0];
  let o=55+t.g*w[0]+t.a*w[1]+t.p*.6-t.og*3-t.y*.5-t.r*2;
  if(m.pos==="P")o+=t.p*1-t.gs*.7+t.ps*2;
  return Math.max(40,Math.min(99,Math.round(o)))}

// Aggiorna la pagina cambiando solo ciò che è diverso (niente più "sfarfallio" a ogni gol: immagini, scorrimenti e animazioni restano al loro posto).
function morphInto(root,html){
  const t=document.createElement("template");t.innerHTML=html;
  const sync=(o,n)=>{
    if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName)return false;
    if(n.nodeType!==1){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;return true}
    for(const at of [...o.attributes])if(!n.hasAttribute(at.name))o.removeAttribute(at.name);
    for(const at of n.attributes)if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
    const tag=o.nodeName;
    if(tag==="TEXTAREA"){if(o!==document.activeElement&&o.value!==n.value)o.value=n.value;return true}
    kids(o,n);
    if(tag==="INPUT"){const ty=(o.type||"").toLowerCase();
      if(ty==="checkbox"||ty==="radio"){if(o.checked!==n.checked)o.checked=n.checked}
      else if(ty!=="file"&&o!==document.activeElement&&o.value!==n.value)o.value=n.value}
    else if(tag==="SELECT"&&o.value!==n.value)o.value=n.value;
    return true};
  const kids=(o,n)=>{
    const nk=[...n.childNodes];
    nk.forEach((c,i)=>{const e=o.childNodes[i];
      if(!e)o.appendChild(c);
      else if(!sync(e,c))o.replaceChild(c,e)});
    while(o.childNodes.length>nk.length)o.lastChild.remove()};
  kids(root,t.content)}
function render(){
  if(!S.db)return;const a=$("app"),old=a.querySelector(".view"),oldTop=old?old.scrollTop:0,fx=fxBefore();
  if(!S.profile){applyTheme(null,null);applyMode();syncBar();morphInto(a,plain(regView()));keepScroll("reg",oldTop);return}
  const mine=S.members.filter(m=>m.uid===S.uid);
  const team=S.teams.find(t=>t.id===S.tid);
  applyTheme(team&&myMember()?team.color:null,team&&myMember()?team.bg:null);applyMode();syncBar();
  if(!team||!myMember()){morphInto(a,plain(homeView(mine)));keepScroll("home",oldTop);return}
  morphInto(a,teamView(team));
  keepScroll([S.tab,S.mid||"",S.cs||"",S.ps||""].join("|"),oldTop);fxAfter(fx);
  if(S.err){toast(S.err);S.err=""}
}

const FORMATIONS={
  "3-1":["P","D1","D2","D3","A"],
  "2-2":["P","D1","D2","A1","A2"],
  "1-2-1":["P","D","C1","C2","A"],
  "4-0":["P","G1","G2","G3","G4"]
};
function formationData(x){const f=x.formation||{};const scheme=FORMATIONS[f.scheme]?f.scheme:"3-1";const players=Array.isArray(f.players)?f.players.slice(0,5):[];while(players.length<5)players.push("");return {scheme,players}}
function formationOptions(x,slot){
  const present=new Set((x.present||[]).map(String));
  const current=formationData(x).players;
  return S.members.filter(m=>m.tid===x.tid&&m.role==='giocatore'&&present.has(String(m.id))).map(m=>{
    const used=current.some((id,i)=>i!==current.indexOf(slot)&&id===m.id);
    return `<option value="${esc(m.id)}" ${slot===m.id?'selected':''} ${used&&slot!==m.id?'disabled':''}>${esc(m.name||m.nick||'')} ${m.num?'· #'+esc(m.num):''}</option>`;
  }).join('');
}
function formationCard(x,mgr){
  const f=formationData(x),labels=FORMATIONS[f.scheme]||FORMATIONS['3-1'];
  const slots=labels.map((label,i)=>{const val=f.players[i]||'';return `<div><label>${label}</label><select class="fi" data-i="${i}" ${mgr?'':'disabled'} onchange="formationSlotChanged('${x.id}')"><option value="">— Nessuno —</option>${formationOptions(x,val)}</select></div>`}).join('');
  const present=(x.present||[]).map(String);
  const starters=f.players.filter(Boolean).map(String);
  const bench=S.members.filter(m=>m.tid===x.tid&&m.role==='giocatore'&&present.includes(String(m.id))&&!starters.includes(String(m.id)));
  return `<div class="card"><div class="row"><h3 style="margin:0;flex:1">Formazione iniziale</h3>${mgr?`<select id="formation-scheme" style="max-width:150px" onchange="formationRender('${x.id}',this.value)">${Object.keys(FORMATIONS).map(k=>`<option value="${k}" ${k===f.scheme?'selected':''}>${k}</option>`).join('')}</select>`:`<span class="tag">${esc(f.scheme)}</span>`}</div>
  <p class="mu">Scegli tra i giocatori presenti: portiere + 4 giocatori di movimento.</p>
  <div id="formation-slots" class="formation-grid">${slots}</div>
  <div class="mu" style="margin-top:10px">Panchina: ${bench.length?bench.map(m=>esc(m.name||m.nick)).join(' · '):'nessuno dei presenti è fuori dalla formazione iniziale.'}</div>
  ${mgr?`<button style="margin-top:10px" onclick="formationClear()">Azzera formazione</button>`:''}</div>`;
}
function formationSlotChanged(id){
  const x=S.matches.find(m=>m.id===id); if(!x)return;
  x.formation=collectFormation(x); markDirty();
  const holder=document.getElementById('formation-holder');
  if(holder) holder.innerHTML=formationCard(x,canManage());
}
function formationRender(id,scheme){
  const x=S.matches.find(m=>m.id===id);if(!x)return;
  if(scheme&&FORMATIONS[scheme]){
    const old=formationData(x);x.formation={scheme,players:old.players.slice(0,5)};
  }
  const holder=document.getElementById('formation-holder');if(holder)holder.innerHTML=formationCard(x,canManage());

function makeClaude(uid){
  const T=()=>sb.from("docs"),P=p=>{const a=p.split("/");return{c:a[0],id:a[1]}};
  const snap=r=>({id:r.id,exists:true,data:()=>r.data});
  const chk=r=>{if(r.error)throw{code:r.error.code||"errore",message:r.error.message};return r};
  let n=0,mergeOk=true;const fulls=new Set();
  const listen=(c,fn)=>{const ch=sb.channel("ch"+c+(++n)).on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const o=(p.new&&p.new.collection)||(p.old&&p.old.collection);if(!o||o===c)fn(p)}).subscribe();return()=>sb.removeChannel(ch)};
  const get1=(c,id)=>T().select("data").eq("collection",c).eq("id",id).maybeSingle();

    doc:p=>{const{c,id}=P(p);return{
      set:async d=>chk(await T().upsert({collection:c,id,data:d})),
      update:async d=>{

          mergeOk=false;window.__rpcErr=(q.error.code||"")+" "+(q.error.message||"")}

      delete:async()=>chk(await T().delete().eq("collection",c).eq("id",id)),
      onSnapshot:(f,e)=>{const run=async()=>{const r=await get1(c,id);if(r.error)return e&&e({code:r.error.code});f(r.data?snap({id,data:r.data.data}):{exists:false,data:()=>undefined})};run();return listen(c,run)}}},
    collection:c=>({onSnapshot:(f,e,opt)=>{let rows=null,tm=0,tf=0;
      const emit=()=>{tf=0;f({docs:[...rows.values()].map(snap)})};
      const soon=()=>{if(!tf)tf=setTimeout(emit,60)};
      const full=async()=>{const r=await T().select("id,data").eq("collection",c);if(r.error)return e&&e({code:r.error.code});rows=new Map(r.data.map(x=>[x.id,x]));emit()};
      const boot=async()=>{if(opt&&opt.recent){const r=await T().select("id,data").eq("collection",c).gte("data->>date",opt.recent);if(!r.error&&!rows){rows=new Map(r.data.map(x=>[x.id,x]));emit()}}await full()};
      fulls.add(full);boot();
      return listen(c,p=>{
        if(rows&&(p.eventType==="INSERT"||p.eventType==="UPDATE")&&p.new&&p.new.collection===c&&p.new.id!=null&&p.new.data!==undefined){rows.set(p.new.id,{id:p.new.id,data:p.new.data});soon()}

}
