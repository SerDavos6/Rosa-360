/* ===== Squadra · nuova interfaccia =====
   Struttura: intestazione fissa in alto, contenuto che scorre al centro, barra di navigazione fissa in basso.

:root{--ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--num:Oswald,"Arial Narrow",sans-serif;--navh:60px;--r:16px;
 --bg:#f4f6fa;--sf:#ffffff;--tx:#0f172a;--mu:#55637a;--bd:#e5e9f0;--ac:#0b7a43;--acf:#0b7a43;--ac2:#e8f3ec;--on:#ffffff;--dg:#c62828;color-scheme:light}
:root:root:root{--bg:#0b0f17;--sf:#121826;--tx:#f1f5f9;--mu:#94a3b8;--bd:#222c3c;--ac:#f5c518;--acf:#f5c518;--ac2:#2a2615;--on:#111111;--dg:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}

/* --- intestazione fissa --- */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--sf);border-bottom:1px solid var(--bd)}

button{font:700 15px var(--ui);color:var(--tx);min-height:44px;padding:10px 16px;border-radius:12px;background:var(--sf);border:1px solid var(--bd);cursor:pointer;transition:transform .1s}

.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700}

.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.pbtns button{min-height:46px;padding:10px 8px;font-size:14px}
.pcard .out{display:block;width:100%;margin-top:14px;padding-top:14px;border:0;border-top:1px solid var(--bd);border-radius:0;background:none;color:var(--dg);min-height:48px}
.code{font-size:30px;font-weight:800;letter-spacing:4px;text-align:center;padding:12px;border:2px dashed var(--bd);border-radius:16px;margin:8px 0;cursor:pointer;background:var(--bg)}
.tcard{display:flex;align-items:center;gap:12px;cursor:pointer}.tcard:active{transform:scale(.99)}.tcard .mid{flex:1;min-width:0}
.logo0{text-align:center;padding:18px 0 8px}.logo0 img{width:96px;height:96px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.logo0 h1{margin:12px 0 4px;font-size:34px}

/* --- scheda giocatore: pannello dal basso --- */
.pmw{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(5,8,14,.66)}
.pm{width:100%;max-width:560px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--sf);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sheet .32s cubic-bezier(.2,.85,.25,1)}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.pm h2:first-of-type{margin-top:0}

/* --- finestre di condivisione --- */
dialog{max-width:600px;width:calc(100% - 24px);max-height:90vh;max-height:90dvh;overflow-y:auto;border:0;border-radius:24px;background:var(--sf);color:var(--tx);padding:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,12,20,.72)}dialog img{width:100%;height:auto;border-radius:12px;margin:12px 0}dialog .row{position:sticky;bottom:0;background:var(--sf);padding:8px 0}
.report-colors{display:flex;gap:16px;border:1px solid var(--bd);border-radius:12px;margin:12px 0;padding:10px 14px}.report-colors legend{font-size:13px;color:var(--mu)}.report-colors label{flex:1;margin:0}.report-colors input{display:block;height:42px;padding:3px;margin-top:5px;cursor:pointer}
.report-full{display:flex;gap:8px;align-items:center;margin:14px 0}.report-full input{width:auto;flex:0 0 auto}#report-image[aria-busy="true"]{opacity:.55}

/* --- mobile/PWA robustness: niente overflow orizzontale nelle liste --- */
@media (max-width:760px){
  #app{width:100%;max-width:none}
  .bar{padding-left:14px;padding-right:14px}
  .mbar{overflow:hidden}
  .mscore{min-width:0}
  .mscore .tm{min-width:0;overflow:hidden}
  .mscore .tm span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pg{width:100%;min-width:0}
  .card{min-width:0}
  .row{min-width:0}
  .row>*{min-width:0}
}
@supports (-webkit-touch-callout:none){
  html,body{background:var(--bg)}
  body{-webkit-overflow-scrolling:touch}
  .bar,.bn,.sbar{background:var(--sf);background-color:var(--sf);backdrop-filter:none;-webkit-backdrop-filter:none}
  .card,.pcg label,input,select,textarea,button{backdrop-filter:none;-webkit-backdrop-filter:none}
}

const FORMATIONS={
  "3-1":["P","D1","D2","D3","A"],
  "2-2":["P","D1","D2","A1","A2"],
  "1-2-1":["P","D","C1","C2","A"],
  "4-0":["P","G1","G2","G3","G4"]
};
function formationData(x){const f=x.formation||{};const scheme=FORMATIONS[f.scheme]?f.scheme:"3-1";const players=Array.isArray(f.players)?f.players.slice(0,5):[];while(players.length<5)players.push("");return {scheme,players}}
function formationOptions(x,slot){
  const present=new Set((x.present||[]).map(String));
  const current=formationData(x).players;
  return matchRoster(x).filter(m=>m.role==='giocatore'&&present.has(String(m.id))).map(m=>{
    const used=current.some((id,i)=>i!==current.indexOf(slot)&&id===m.id);
    return `<option value="${esc(m.id)}" ${slot===m.id?'selected':''} ${used&&slot!==m.id?'disabled':''}>${esc(m.name||m.nick||'')} ${m.num?'· #'+esc(m.num):''}</option>`;
  }).join('');
}
function formationCard(x,mgr){
  const f=formationData(x),labels=FORMATIONS[f.scheme]||FORMATIONS['3-1'];
  const slots=labels.map((label,i)=>{const val=f.players[i]||'';return `<div><label>${label}</label><select class="fi" data-i="${i}" ${mgr?'':'disabled'} onchange="formationSlotChanged('${x.id}')"><option value="">— Nessuno —</option>${formationOptions(x,val)}</select></div>`}).join('');
  const present=(x.present||[]).map(String);
  const starters=f.players.filter(Boolean).map(String);
  const bench=matchRoster(x).filter(m=>m.role==='giocatore'&&present.includes(String(m.id))&&!starters.includes(String(m.id)));
  return `<div class="card"><div class="row"><h3 style="margin:0;flex:1">Formazione iniziale</h3>${mgr?`<select id="formation-scheme" style="max-width:150px" onchange="formationRender('${x.id}',this.value)">${Object.keys(FORMATIONS).map(k=>`<option value="${k}" ${k===f.scheme?'selected':''}>${k}</option>`).join('')}</select>`:`<span class="tag">${esc(f.scheme)}</span>`}</div>

  <div id="formation-slots" class="formation-grid">${slots}</div>
  <div class="mu" style="margin-top:10px">Panchina: ${bench.length?bench.map(m=>esc(m.name||m.nick)).join(' · '):'nessuno dei presenti è fuori dalla formazione iniziale.'}</div>
  ${mgr?`<button style="margin-top:10px" onclick="formationClear()">Azzera formazione</button>`:''}</div>`;

function formationSlotChanged(id){
  const x=S.matches.find(m=>m.id===id); if(!x)return;
  x.formation=collectFormation(x); markDirty();
  const holder=document.getElementById('formation-holder');
  if(holder) holder.innerHTML=formationCard(x,editOn());
}
function formationRender(id,scheme){
  const x=S.matches.find(m=>m.id===id);if(!x)return;
  if(scheme&&FORMATIONS[scheme]){
    const old=formationData(x);x.formation={scheme,players:old.players.slice(0,5)};
  }
  const holder=document.getElementById('formation-holder');if(holder)holder.innerHTML=formationCard(x,editOn());

function formationClear(){document.querySelectorAll('.fi').forEach(e=>e.value='');markDirty()}
function collectFormation(x){const holder=document.getElementById('formation-holder');if(!holder)return formationData(x);return {scheme:document.getElementById('formation-scheme')?.value||formationData(x).scheme,players:[...holder.querySelectorAll('.fi')].slice(0,5).map(e=>e.value||'')};}

async function doAuth(up){const email=v("le"),password=$("lp").value;
  if(!email||password.length<6){$("lm").textContent="Inserisci email e una password di almeno 6 caratteri.";return}
  const r=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(r.error){$("lm").textContent=r.error.message;return}
  if(!r.data.session){$("lm").textContent="Controlla la tua email per confermare l\u2019account, poi accedi.";return}
  boot()}
async function forgotPassword(){
  const email=v("le");
  if(!email){$("lm").textContent="Inserisci prima la tua email.";return}
  $("lm").textContent="Invio email di recupero…";
  const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
  if(r.error){$("lm").textContent=r.error.message;return}
  $("lm").textContent="Ti ho inviato un'email per reimpostare la password. Controlla anche la posta indesiderata.";
}
function resetPasswordView(msg){$("app").innerHTML=plain(`<div class="logo0"><img src="icon-192.png" alt=""><h1>Nuova password</h1><div class="mu">Scegli una nuova password per il tuo account</div></div><div class="card"><label>Nuova password (almeno 6 caratteri)</label><input id="rp1" type="password" autocomplete="new-password"><label>Ripeti la password</label><input id="rp2" type="password" autocomplete="new-password"><div class="err" id="rm">${msg||""}</div><p><button class="p" onclick="updatePassword()">Salva nuova password</button></p></div>`)}
async function updatePassword(){
  const p1=$("rp1").value,p2=$("rp2").value;
  if(p1.length<6){$("rm").textContent="La password deve avere almeno 6 caratteri.";return}
  if(p1!==p2){$("rm").textContent="Le password non coincidono.";return}
  const r=await sb.auth.updateUser({password:p1});
  if(r.error){$("rm").textContent=r.error.message;return}
  try{window.history.replaceState({},document.title,window.location.pathname)}catch(e){}
  S.tab="home";
  $("app").innerHTML=plain('<div class="card"><b>Password aggiornata.</b><p class="mu">Accesso effettuato. Ti porto alle partite…</p></div>');
  setTimeout(()=>boot(),400);
}
// Link per i tifosi (?squadra=ID): apre direttamente la squadra in sola lettura. Il parametro si toglie dall'indirizzo appena letto.
let LINK=(()=>{try{const v=new URLSearchParams(location.search).get("squadra");return v&&/^[\w.:@+~-]{1,120}$/.test(v)?v:null}catch(e){return null}})();
function openLink(){const id=LINK;if(!id)return;LINK=null;
  try{const u=new URL(location.href);u.searchParams.delete("squadra");history.replaceState({},"",u.pathname+u.search+u.hash)}catch(e){}
  if(typeof fanOpen==="function")fanOpen(id)}
async function boot(){
  if(SB_URL.startsWith("INCOLLA")){$("app").innerHTML=plain('<div class="card"><b>Configurazione mancante.</b><p class="mu">Inserisci Project URL e anon key di Supabase all\u2019inizio dello script.</p></div>');return}
  const{data:{session}}=await sb.auth.getSession();
  const recovery=window.location.hash.includes("type=recovery");
  if(recovery)return resetPasswordView();
  if(!session){try{if((LINK||localStorage.getItem("fan")==="1")&&typeof fanStart==="function")return fanStart().then(openLink)}catch(e){}return loginView()}
  S.tab="home";S.authEmail=session.user.email||"";
  makeClaude(session.user.id);
  try{const r=await sb.from("docs").select("data").eq("collection","profiles").eq("id",session.user.id).maybeSingle(),pf=r&&r.data&&r.data.data;
    if(pf&&pf.fan&&typeof fanStart==="function")return fanStart(pf,session.user.id).then(openLink)}catch(e){}
  await init();
  if(LINK&&typeof fanBrowse==="function"){await fanBrowse();openLink()}}
if(typeof fluidoStart==="function")fluidoStart();
boot();
